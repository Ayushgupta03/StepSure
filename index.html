<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StepSure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
/* Layout: one centred phone on a pale clinical ground; app fills the screen below 560px. Single light theme by design. */
:root{
  --page:#E8EDF3; --page-deep:#D9E1EB;
  --navy:#0F1F3D; --ink:#2A3854; --muted:#5D6A80; --faint:#8C96A8;
  --line:#E1E6EE; --soft:#F3F6FA; --surface:#FFFFFF;
  --blue:#2459C2; --blue-soft:#E7EEFB;
  --teal:#0D7A76; --teal-soft:#E0F2F0;
  --amber:#8F5300; --amber-bg:#FFF4DE; --amber-line:#E7A23A;
  --red:#A8261D; --red-bg:#FDEDEB;
  --off:#A2ACBC; --bezel:#0B1525;
  --f-display:"Sora","Figtree",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Stage */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 16px 22px;
  background:radial-gradient(1200px 700px at 50% 40%,#F4F7FA 0%,var(--page) 55%,var(--page-deep) 100%)}
.bar{width:min(100%,560px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--navy);letter-spacing:-.01em}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.tier{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 1px 2px rgba(15,31,61,.06)}
.tier button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tier button[aria-checked="true"]{background:var(--navy);color:#fff}
.tier button svg{width:15px;height:15px}
.reset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:6px}
.reset svg{width:16px;height:16px}
.reset:hover,.tier button:hover:not([aria-checked="true"]){background:var(--soft)}

.device{--w:min(392px,calc(100vw - 32px),max(280px,calc((100vh - 120px) * .476)));flex:none;width:var(--w);height:calc(var(--w) * 824 / 392);max-width:100%;background:var(--bezel);border-radius:calc(var(--w) * .135);padding:calc(var(--w) * .028);
  box-shadow:0 0 0 2px #1E2A3D inset,0 30px 60px -20px rgba(15,31,61,.45),0 12px 24px -12px rgba(15,31,61,.3)}
@supports (height:100dvh){.device{--w:min(392px,calc(100vw - 32px),max(280px,calc((100dvh - 120px) * .476)))}}
/* The frame never grows with content: its height comes from its width and aspect ratio, and only the screen inside scrolls. */
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--w) * .108);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}

.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:600;font-size:14px;color:var(--navy);font-variant-numeric:tabular-nums;position:relative}
.sb .notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:var(--bezel)}
.sb .sys{display:flex;gap:5px;align-items:center}
.sb .sys svg{width:16px;height:16px}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;position:relative}
.view.enter{animation:enter .24s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:6px 18px 24px;display:flex;flex-direction:column;gap:14px}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff;padding:6px 6px 10px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:600;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--navy)}
.tabs button[aria-current="page"] svg{color:var(--teal)}

/* Type */
h1,h2,h3{margin:0;color:var(--navy);text-wrap:balance}
.greet h1{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.title{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.eyebrow{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h3{font-size:16px;font-weight:700;color:var(--navy)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.note{margin:0;color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left}
.card.soft{background:var(--soft);border-color:transparent}
button.card{width:100%;transition:border-color .15s,box-shadow .15s}
button.card:hover{border-color:#C9D2E0;box-shadow:0 2px 10px -4px rgba(15,31,61,.18)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link-s{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:14px;font-weight:600}
.link-s svg{width:16px;height:16px}

/* Banners */
.banner{width:100%;border-radius:16px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid transparent}
.banner>svg{margin-top:1px;width:22px;height:22px}
.b-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.b-txt strong{font-size:15px;color:var(--navy)}
.b-txt span{font-size:13.5px;color:var(--ink)}
.b-cta{align-self:center;display:flex;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.b-cta svg{width:16px;height:16px}
.banner.ok{background:var(--teal-soft);color:var(--teal)}
.banner.warn{background:var(--amber-bg);border-color:#F3D29A;color:var(--amber)}
.banner.off{background:#EEF1F5;border-color:#D5DBE5;color:#4A5669}
.banner.done{background:var(--soft);color:var(--teal)}
.banner.urgent{background:var(--red-bg);color:var(--red)}
button.banner:hover{filter:brightness(.985)}

/* Device card */
.ins-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins{display:flex;flex-direction:column;gap:7px;padding:11px 12px;border-radius:14px;background:var(--soft)}
.ins-top{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--navy)}
.ins-top svg{color:var(--teal);width:18px;height:18px}
.batt{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--navy)}
.bat-ic{position:relative;width:26px;height:13px;border:1.8px solid currentColor;border-radius:3.5px;color:#5D6A80;flex:none;box-sizing:border-box}
.bat-ic::after{content:"";position:absolute;right:-4.5px;top:2.5px;width:2.5px;height:4.5px;border-radius:0 1.5px 1.5px 0;background:currentColor}
.bat-ic i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;max-width:calc(100% - 3px);border-radius:1.5px;background:var(--teal)}
.bat-ic.low{color:var(--amber)}.bat-ic.low i{background:var(--amber-line)}
.bat-low{font-size:11.5px;font-weight:700;color:var(--amber)}
.kv dd .batt{font-size:inherit}
.ins-st{font-size:12.5px;font-weight:600;color:var(--teal)}
.ins.is-off{background:#F1F2F5;outline:1.5px dashed #C3CAD6;outline-offset:-1.5px}
.ins.is-off .ins-top svg,.ins.is-off .ins-st{color:#6B7689}
.ins.is-off .bat-ic i{background:var(--off)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta-row span{display:flex;align-items:center;gap:5px}
.meta-row svg{width:15px;height:15px}
.q-ok{color:var(--teal)!important;font-weight:600}
.q-bad{color:var(--amber)!important;font-weight:700}

/* Segmented */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.seg button svg{width:15px;height:15px}
.seg button[aria-checked="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,31,61,.14)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

/* Foot map */
.hm{position:relative;width:100%;max-width:300px;aspect-ratio:300/306;align-self:center;container-type:inline-size}
.hm img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hm-chip{position:absolute;transform:translate(-50%,-50%);font:700 max(9px,3.4cqw)/1.25 var(--f-body);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.93);color:var(--navy);padding:.15em .4em;border-radius:7px;box-shadow:0 1px 3px rgba(15,31,61,.25);white-space:nowrap}
.hm-chip.hot{background:var(--navy);color:#fff;animation:hot 1.8s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 5px rgba(231,162,58,.45)}}
.hm-lab{position:absolute;transform:translate(-50%,-50%);font:700 max(10px,3.8cqw) var(--f-body);letter-spacing:.06em;color:var(--navy)}
.hm-off{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-size:max(9.5px,3.4cqw);color:#6B7689;text-align:center;white-space:nowrap}
.hm-off b{font-size:1.15em;color:#4A5669}
.legend{display:flex;flex-direction:column;gap:4px}
.legend .ramp{height:9px;border-radius:9px}
.legend .ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend .ltitle{font-size:12px;font-weight:600;color:var(--ink)}

/* Foot map status + explainer */
.map-status{display:flex;gap:9px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.map-status svg{width:18px;height:18px;margin-top:1px}
.map-status.ok{background:var(--teal-soft);color:#0A5E5B}
.map-status.att{background:var(--amber-bg);color:var(--amber)}
.map-status.na{background:#EEF1F5;color:#4A5669}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.watch{background:#FFF8E6;color:#7A5A00;box-shadow:inset 0 0 0 1px #F0D88A}
.pill.att{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.na{background:#EEF1F5;color:#6B7689}
.bands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bands li{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;font-size:13.5px}
.zt td,.zt th{padding:7px 4px}
.zt td:first-child{font-weight:600;color:var(--navy)}
.zt td:not(:first-child),.zt th:not(:first-child){text-align:right}
.zt tr.att td{background:var(--amber-bg)}

/* Rows */
.row-card{flex-direction:row!important;align-items:center;gap:12px!important}
.row-card>svg:first-child{width:24px;height:24px;color:var(--teal)}
.row-card>svg:last-child{color:var(--faint)}
.rc-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.rc-txt strong{color:var(--navy);font-size:15px}
.rc-txt span{font-size:13px;color:var(--muted)}
.demo-row{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px dashed var(--line);padding-top:12px;font-size:12px;color:var(--faint)}
.demo-link{border:1px dashed #BAC4D3;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.demo-link:hover{border-color:var(--amber-line);color:var(--amber)}

/* Buttons */
.btn{border:0;border-radius:14px;min-height:48px;padding:12px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;transition:background .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover:not(:disabled){background:#1B305A}
.btn.secondary{background:#fff;color:var(--navy);border:1.5px solid #CDD5E1}
.btn.secondary:hover:not(:disabled){background:var(--soft)}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:none;color:var(--blue);min-height:40px}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adv{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--blue);background:var(--blue-soft);padding:3px 7px 3px 5px;border-radius:999px;white-space:nowrap}
.adv svg{width:12px;height:12px}
.ess{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);padding:3px 8px;border-radius:999px}
.locked{width:100%;display:flex;align-items:center;gap:10px;border:1.5px dashed #C9D3E3;border-radius:14px;padding:11px 12px;background:none;text-align:left;font-size:14px;color:var(--muted)}
.locked svg{width:18px;height:18px;color:var(--blue)}
.locked strong{color:var(--navy);font-weight:700}
.locked:hover{background:var(--soft)}

.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-weight:600;font-size:15px;padding:6px 4px 2px 0;align-self:flex-start}
.back svg{width:18px;height:18px}

/* Key-values */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:1px 0 0;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.status{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.s-ok{background:var(--teal-soft);color:var(--teal)}
.s-warn{background:#EEF1F5;color:#4A5669}
.ins-card.is-off{background:#FAFBFC;border-style:dashed}

/* Charts */
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:#E7EBF1;stroke-width:1}
.c-ylab,.c-xlab{font:500 10px var(--f-body);fill:#6E7A8E;font-variant-numeric:tabular-nums}
.c-line{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.c-thr{stroke:var(--amber-line);stroke-width:1.5;stroke-dasharray:5 4}
.c-tlab{font:700 10px var(--f-body);fill:var(--amber)}
.c-target{stroke:#9AA6B8;stroke-width:1.2;stroke-dasharray:3 4}
.c-glab{font:600 10px var(--f-body);fill:#6E7A8E}
.c-bar{fill:var(--teal)}
.c-bar.partial{fill:#C4CBD6}
.c-bar.today{fill:#8BC7C2}
.c-gap{fill:url(#hatch)}
.c-area{opacity:.12}
.c-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.c-key span{display:flex;align-items:center;gap:6px}
.c-key i{width:14px;height:3px;border-radius:3px;display:inline-block}
.c-key i.dot{width:9px;height:9px;border-radius:50%}
.c-key i.hollow{width:9px;height:9px;border-radius:50%;border:1.8px solid var(--teal);background:#fff}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:9px 10px;min-width:0}
.stat b{display:block;font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.25;display:block}
.stat.warn{background:var(--amber-bg)}
.stat.warn b{color:var(--amber)}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.list li>svg{width:18px;height:18px;margin-top:1px;color:var(--teal)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.steps li.urg::before{background:var(--red)}
.callout{border-radius:14px;padding:12px 13px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.callout svg{width:18px;height:18px;margin-top:1px}
.callout.info{background:var(--blue-soft);color:#1E3F87}
.callout.info b{color:var(--navy)}
.callout.urgent{background:var(--red-bg);color:var(--red)}

/* Tracker */
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.track li{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.track li:first-child{border-top:0;padding-top:2px}
.track .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #C3CBD7;background:#fff}
.track .dot.on{border-color:var(--teal);background:var(--teal)}
.track .dot.mid{border-color:var(--blue);background:var(--blue-soft)}
.track .dot.na{border-style:dashed}
.track .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.track .tt strong{font-size:14px;color:var(--navy)}
.track .tt span{font-size:12.5px;color:var(--muted)}
.track .act{border:1px solid #CDD5E1;background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap}
.track .act:hover{background:var(--soft)}
.pipe{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:3px;flex-wrap:wrap}
.pipe .p{padding:2px 8px;border-radius:999px;background:#EEF1F5;color:#7A8597}
.pipe .p.on{background:var(--teal-soft);color:var(--teal)}
.pipe svg{width:13px;height:13px;color:var(--faint)}

/* Report */
.rep{display:flex;flex-direction:column;gap:14px}
.rep-head{border-bottom:2px solid var(--navy);padding-bottom:10px}
.rep-head h2{font-family:var(--f-display);font-size:19px;font-weight:600}
.rep-sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rep-sec p,.rep-sec li{font-size:14px}
.rep-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.hot{color:var(--amber);font-weight:700}
.rep-foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions .btn{font-size:14px;min-height:46px;padding:10px}
.actions .wide{grid-column:1/-1}

/* Chat */
.view.chat{display:flex;flex-direction:column;overflow:hidden}
.chat-top{padding:4px 18px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.chat-top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.disc{font-size:12px;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14.5px;animation:enter .22s ease-out}
.msg.a{background:var(--soft);color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.msg.u{background:var(--navy);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .vt{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;opacity:.75;margin-bottom:3px}
.msg .vt svg{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px}
.chip{border:1.5px solid #C9D3E3;background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--navy);text-align:left}
.chip:hover{background:var(--blue-soft);border-color:#AFC3EA}
.composer{display:flex;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;min-width:0;border:1.5px solid #CDD5E1;border-radius:999px;padding:11px 15px;font-size:15px;background:#fff}
.composer input:focus{outline:none;border-color:var(--blue)}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.ibtn.send{background:var(--navy);color:#fff}
.ibtn.mic{background:var(--teal-soft);color:var(--teal)}
.ibtn svg{width:20px;height:20px}
.listen{position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;animation:enter .2s}
.rings{position:relative;width:110px;height:110px;display:grid;place-items:center}
.rings i{position:absolute;inset:0;border-radius:50%;background:var(--teal);opacity:.18;animation:ring 1.6s ease-out infinite}
.rings i:nth-child(2){animation-delay:.5s}.rings i:nth-child(3){animation-delay:1s}
@keyframes ring{from{transform:scale(.5);opacity:.35}to{transform:scale(1.25);opacity:0}}
.rings b{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;position:relative}
.rings b svg{width:28px;height:28px}
.listen p{font-weight:700;color:var(--navy)}
.wave{display:flex;gap:4px;align-items:center;height:28px}
.wave i{width:4px;border-radius:4px;background:var(--teal);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(odd){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}
@keyframes wave{0%,100%{height:6px}50%{height:26px}}

/* Preview (Free) */
.pv{border-radius:18px;background:linear-gradient(160deg,#F3F7FE,#EEF6F5);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid #DCE6F5}
.pv .mini{display:flex;flex-direction:column;gap:6px;pointer-events:none;opacity:.9}
.pv .mini .msg{font-size:13px;max-width:92%;animation:none}
.pv .msg.a{background:#fff}

/* Profile */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:600}
.who{display:flex;gap:14px;align-items:center}
.switch{width:46px;height:28px;border-radius:999px;border:0;background:#CCD3DE;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.layer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.layer[hidden]{display:none!important}
.scrim{position:absolute;inset:0;background:rgba(11,21,37,.42);border:0;padding:0;cursor:default}
.panel{position:relative;background:#fff;border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;padding:10px 18px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px -10px rgba(15,31,61,.3)}

.panel>*{flex-shrink:0}
.layer.anim .scrim{animation:fade .25s}
.layer.anim .panel{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:5px;background:#D7DDE6;align-self:center}
.panel h2{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.x svg{width:18px;height:18px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;color:var(--navy);font-size:14.5px;padding:0;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}

.opt svg{width:16px;height:16px;color:transparent}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--navy)}

.checks .opt{width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--navy);font-size:14.5px}

.field textarea:focus,.field input:focus{outline:none;border-color:var(--blue)}
.err{color:var(--red);font-size:13px;font-weight:600}
.prog{display:flex;gap:6px}

.pair{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft)}

.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--navy);color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 10px 24px -8px rgba(15,31,61,.5);animation:up .25s}

#printArea{display:none}

const HCACHE={};
let HMASK=null;
const jet=t=>{t=Math.max(0,Math.min(1,.08+t*.92));const f=c=>Math.round(255*Math.max(0,Math.min(1,1.5-Math.abs(4*t-c))));return [f(3),f(2),f(1)]};
const gs=(dx,dy,s)=>Math.exp(-(dx*dx+dy*dy)/(2*s*s));
function pField(v,x,y){
 let p=v.heel*gs(x-54,y-224,17)+v.m1*gs(x-86,y-84,14)+v.m3*gs(x-63,y-78,13)+v.m5*gs(x-34,y-100,12)+v.mid*1.2*gs(x-37,y-165,16)+v.hal*gs(x-88,y-34,10);
 [[66,27],[51,30],[38,37],[28,48]].forEach((t,i)=>{p+=(150-i*25)*gs(x-t[0],y-t[1],6.5)});
 return p;
}
function tField(v,x,y){let sw=.06,st=.06*29.6;
 for(const z in SEN){const [sx,sy]=SEN[z],w=gs(x-sx,y-sy,z==='m1'?15:z==='mid'||z==='heel'?24:18);sw+=w;st+=w*v[z]}
 return st/sw;
}
function footPath(){const p=new Path2D(SOLE);TOES.forEach(t=>{p.moveTo(t[0]+t[2],t[1]);p.ellipse(t[0],t[1],t[2],t[3],0,0,Math.PI*2)});return p}
function getMask(){
 if(HMASK) return HMASK;
 const c=document.createElement('canvas');c.width=HW*HS;c.height=HH*HS;const x=c.getContext('2d');x.scale(HS,HS);
 FEET.forEach(f=>{x.save();x.translate(f.mir?f.ox+120:f.ox,OY);if(f.mir)x.scale(-1,1);x.fill(footPath());x.restore()});
 HMASK=x.getImageData(0,0,c.width,c.height).data;return HMASK;
}
function heatImg(mode){
 const vals=mode==='temp'?temps():PRESS;
 const key=mode+(S.alert?'a':'')+(S.dev.L.on?'L':'')+(S.dev.R.on?'R':'');
 if(HCACHE[key]) return HCACHE[key];
 try{
  const c=document.createElement('canvas');c.width=HW*HS;c.height=HH*HS;const x=c.getContext('2d');
  const m=getMask(),img=x.createImageData(c.width,c.height),d=img.data,lo=HMIN[mode],span=HMAX[mode]-lo;
  for(let py=0;py<c.height;py++)for(let px=0;px<c.width;px++){
   const i=(py*c.width+px)*4,a=m[i+3];if(!a)continue;
   const X=px/HS,Y=py/HS,f=X<HW/2?FEET[0]:FEET[1];if(!S.dev[f.k].on)continue;
   const lx=f.mir?f.ox+120-X:X-f.ox,ly=Y-OY;
   const v=mode==='press'?pField(vals[f.k],lx,ly):tField(vals[f.k],lx,ly);
   const col=jet((v-lo)/span);d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=a;
  }
  x.putImageData(img,0,0);
  x.globalCompositeOperation='destination-over';x.filter='blur(12px)';x.globalAlpha=.35;x.drawImage(c,0,0);x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.scale(HS,HS);
  FEET.forEach(f=>{if(S.dev[f.k].on)return;x.save();x.translate(f.mir?f.ox+120:f.ox,OY);if(f.mir)x.scale(-1,1);const p=footPath();x.fillStyle='#EEF1F5';x.fill(p);x.setLineDash([4,4]);x.strokeStyle='#B3BCC9';x.lineWidth=1.5;x.stroke(p);x.restore()});
  HCACHE[key]=c.toDataURL('image/png');
 }catch(e){HCACHE[key]=''}
 return HCACHE[key];
}
function legend(m){
 const stops=[];for(let i=0;i<=12;i++){const t=i/12;stops.push(`rgb(${jet(t).join(',')}) ${(t*100).toFixed(0)}%`)}
 const t=m==='temp'?['28.5 °C','31 °C','33.5 °C']:['0 kPa','280 kPa','560 kPa'];
 return `<div class="legend"><span class="ltitle">${m==='temp'?'Skin temperature, °C':'Peak pressure, kPa'}</span><div class="ramp" style="background:linear-gradient(90deg,${stops.join(',')})"></div><div class="ticks"><span>${t[0]}</span><span>${t[1]}</span><span>${t[2]}</span></div></div>`;
}
function footMap(mode){
 const vals=mode==='temp'?temps():PRESS,src=heatImg(mode);
 const pct=(x,y)=>`left:${(x/HW*100).toFixed(2)}%;top:${(y/HH*100).toFixed(2)}%`;
 let chips='';
 FEET.forEach(f=>{
  const d=S.dev[f.k],cx=f.ox+60;
  if(!d.on){chips+=`<span class="hm-off" style="${pct(cx,OY+128)}"><b>No signal</b>since ${fmt(d.since)}</span>`;}
  else for(const z in CHIP){const [sx,sy]=CHIP[z],X=f.mir?f.ox+120-sx:f.ox+sx,v=vals[f.k][z],hot=mode==='temp'&&S.alert&&f.k==='L'&&z==='m1';
   chips+=`<span class="hm-chip${hot?' hot':''}" style="${pct(X,sy+OY)}">${mode==='temp'?v.toFixed(1)+(hot?'°':''):v}</span>`}
  chips+=`<span class="hm-lab" style="${pct(cx,294)}">${f.k==='L'?'LEFT':'RIGHT'}</span>`;
 });
 const lbl=mode==='temp'?`Temperature heatmap. ${['L','R'].map(k=>S.dev[k].on?`${sideName(k)} foot ${Object.values(vals[k]).map(v=>v.toFixed(1)).join(', ')} °C`:`${sideName(k)} foot no signal`).join('. ')}`:`Pressure heatmap. ${['L','R'].map(k=>S.dev[k].on?`${sideName(k)} foot ${Object.values(vals[k]).join(', ')} kPa`:`${sideName(k)} foot no signal`).join('. ')}`;
 return `<div class="hm" role="img" aria-label="${esc(lbl)}">${src?`<img src="${src}" alt="">`:''}<div aria-hidden="true">${chips}</div></div>`;
}

/* charts */
function chart(o){
 const W=320,H=o.h||178,L=32,R=10,T=16,B=26,iw=W-L-R,ih=H-T-B,n=14;
 const X=i=>o.bars?L+(i+.5)*iw/n:L+6+i*(iw-12)/(n-1);
 const Y=v=>T+ih-(v-o.min)/(o.max-o.min)*ih;
 let g=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F4F6F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#D3D9E2" stroke-width="2.5"/></pattern></defs>`;
 o.ticks.forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" class="c-grid"/><text x="${L-6}" y="${Y(t)+3.5}" class="c-ylab" text-anchor="end">${t}</text>`});
 [0,3,6,9,13].forEach(i=>{g+=`<text x="${X(i)}" y="${H-8}" class="c-xlab" text-anchor="${i===13?'end':i===0?'start':'middle'}">${i===13?'Today':i===0?'17 Oct':DAYS[i]}</text>`});
 if(o.incomplete) g+=`<rect x="${X(13)-9}" y="${T}" width="18" height="${ih}" class="c-gap"/>`;
 if(o.target!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}" class="c-target"/><text x="${W-R}" y="${Y(o.target)-5}" class="c-glab" text-anchor="end">${o.targetLabel}</text>`;
 if(o.thr!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.thr)}" y2="${Y(o.thr)}" class="c-thr"/><text x="${L+4}" y="${Y(o.thr)-5}" class="c-tlab">${o.thrLabel}</text>`;
 if(o.bars) o.bars.forEach((v,i)=>{const c=i===5?'c-bar partial':i===13?'c-bar today':'c-bar';g+=`<rect x="${(X(i)-6).toFixed(1)}" y="${Y(v).toFixed(1)}" width="12" height="${(Y(o.min)-Y(v)).toFixed(1)}" rx="3" class="${c}"/>`});
 (o.series||[]).forEach(s=>{
  const last=s.cut?12:13;
  const pts=s.v.map((v,i)=>[X(i),Y(v)]);
  const d=pts.slice(0,last+1).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  if(s.area) g+=`<path d="${d} L${pts[last][0].toFixed(1)} ${Y(o.min)} L${pts[0][0].toFixed(1)} ${Y(o.min)}Z" class="c-area" fill="${s.color}"/>`;
  g+=`<path d="${d}" class="c-line" stroke="${s.color}"/>`;
  pts.forEach((p,i)=>{
   if(i>last) return;
   const hot=o.thr!=null&&s.v[i]>=o.thr, partial=i===5;
   const r=hot||i===last?4.2:2.8;
   g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${partial?'#fff':hot?'#E7A23A':s.color}" stroke="${partial?s.color:'#fff'}" stroke-width="${partial?1.8:1.3}"/>`;
  });
 });
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
function tempChart(h){
 const v=tdiff();
 return chart({h,min:0,max:3.5,ticks:[0,1,2,3],thr:THR,thrLabel:'Alert level 2.2 °C',incomplete:anyOff(),
  series:[{v,color:'#0D7A76',area:true,cut:anyOff()}],
  label:`Daily left minus right temperature difference at the 1st metatarsal, 17 to 30 October: ${v.map((x,i)=>DAYS[i]+' Oct '+x+' °C').join(', ')}`});
}

function battery(d){const low=d.bat<20;return `<span class="batt" aria-label="Battery ${d.bat}%${low?', charge soon':''}"><span class="bat-ic${low?' low':''}" aria-hidden="true"><i style="width:${d.bat}%"></i></span><span class="num">${d.bat}%</span>${low?'<span class="bat-low">Charge soon</span>':''}</span>`}
const ZONES=[['hal','Big toe'],['m1','Ball, big-toe side'],['m3','Ball, centre'],['m5','Ball, outer edge'],['mid','Midfoot'],['heel','Heel']];
const PUSUAL={L:{hal:255,m1:405,m3:330,m5:212,mid:95,heel:376},R:{hal:244,m1:372,m3:315,m5:218,mid:90,heel:360}};
const BAND={ok:'Usual',watch:'Keep an eye',att:'Needs attention',na:'No data'};
function tBand(d){const a=Math.abs(d);return a>THR?'att':a>1?'watch':'ok'}
function zoneRows(mode){
 const both=!anyOff(),t=temps();
 return ZONES.map(([z,n])=>{
  if(mode==='temp'){
   const L=S.dev.L.on?t.L[z]:null,R=S.dev.R.on?t.R[z]:null,d=both?+(L-R).toFixed(1):null;
   return {z,n,L,R,d,band:both?tBand(d):'na'};
  }
  const L=S.dev.L.on?PRESS.L[z]:null,R=S.dev.R.on?PRESS.R[z]:null;
  const ch=k=>S.dev[k].on?(PRESS[k][z]-PUSUAL[k][z])/PUSUAL[k][z]:null;
  const worst=[ch('L'),ch('R')].filter(x=>x!=null).reduce((a,b)=>Math.max(a,b),-1);
  return {z,n,L,R,band:worst===-1?'na':worst>.3?'att':worst>.15?'watch':'ok',vs:worst===-1?'No data':worst>.15?'Higher':'Similar'};
 });
}
function mapStatus(mode){
 if(anyOff()){const off=['L','R'].filter(k=>!S.dev[k].on).map(sideName).join(' and ');return `<div class="map-status na">${ic('unplug')}<span>${off} insole not connected. StepSure can't compare your feet until both are connected.</span></div>`}
 const rows=zoneRows(mode),att=rows.filter(r=>r.band==='att');
 if(mode==='temp'){
  if(att.length){const r=att[0];return `<div class="map-status att">${ic('alert')}<span>${att.length} spot needs attention: ${r.d>0?'left':'right'} foot, ${r.n.toLowerCase()}, ${Math.abs(r.d).toFixed(1)} °C warmer than the other foot.</span></div>`}
  return `<div class="map-status ok">${ic('checkc')}<span>All spots are within your usual left vs right range.</span></div>`;
 }
 return att.length?`<div class="map-status att">${ic('alert')}<span>Pressure is higher than usual at ${att.length} spot.</span></div>`:`<div class="map-status ok">${ic('checkc')}<span>Pressure is similar to your usual pattern on both feet.</span></div>`;
}

const SYMC={en:{warmth:'warmth',no_visible:'no redness, swelling or broken skin seen',redness:'some redness',swelling:'some swelling',none:'no symptoms noticed'},hi:{warmth:'गर्माहट',no_visible:'कोई लालिमा, सूजन या कटी त्वचा नहीं दिखी',redness:'थोड़ी लालिमा',swelling:'थोड़ी सूजन',none:'कोई लक्षण महसूस नहीं हुआ'}};
function symList(items,l){return items.map(x=>SYMC[l][x]).join('; ')}
function tx(k,p){const v=T[S.chat.lang][k]!=null?T[S.chat.lang][k]:T.en[k];return typeof v==='function'?v(p||{}):v}
function startChat(){
 const c=S.chat;c.msgs=[];c.pend=[];
 if(alertOpen()){c.stage='ask';say('greet_alert')}
 else {c.stage='idle';say(S.alert?'greet_done':'greet_none')}
}
function say(k,p){S.chat.msgs.push({from:'a',key:k,p})}
function chips(){
 const st=S.chat.stage;
 const m={ask:['warm','nothing','meaning'],more:['none_visible','red','swell'],confirm:['yes','change'],idle:['readings','log'],done:['report']};
 const a=(m[st]||[]).slice();
 if(st==='done'){if(isAdv()&&S.care.on&&!S.care.notice)a.push('notify');a.push('restart')}
 return a;
}
function classify(t){
 t=t.toLowerCase().trim();const st=S.chat.stage;
 if(!t) return null;
 if(/medic|tablet|\bpill|cream|ointment|antibiot|remed|treatment|dawa|dawai|दवा|दवाई|मरहम|इलाज|ilaj/.test(t)) return 'med';
 if(/ulcer|diagnos|infect|अल्सर|संक्रमण|बीमारी|bimari/.test(t)) return 'diag';
 if(/report|रिपोर्ट/.test(t)) return 'report';
 if(/riya|रिया|notify|daughter|बेटी/.test(t)) return 'notify';
 if(/start over|restart|फिर से शुरू/.test(t)) return 'restart';
 if(/^(no|nope|nahi|nahin|na)\b|nothing|kuch nahi|नहीं|कुछ नहीं/.test(t)) return st==='more'?'none_visible':st==='confirm'?'change':'nothing';
 if(/warm|\bhot\b|heat|garam|garm|गर्म|गरम/.test(t)) return 'warm';
 if(/\bred|laal|\blal\b|लाल/.test(t)) return 'red';
 if(/swell|sooj|sujan|सूज/.test(t)) return 'swell';
 if(/^(yes|yeah|yep|ok|okay|correct|right|sure|haan|han|ha|ji|sahi)\b|हाँ|हां|सही/.test(t)) return 'yes';
 if(/change|edit|बदल/.test(t)) return 'change';
 if(/reading|रीडिंग/.test(t)) return 'readings';
 if(/mean|why|explain|matlab|मतलब|क्यों|samjha|समझा/.test(t)) return st==='idle'?'readings':'meaning';
 if(/symptom|\blog\b|लक्षण/.test(t)) return 'log';
 return 'unknown';
}
function respond(intent){
 const c=S.chat;
 if(intent==='med'){say('a_med');return}
 if(intent==='diag'){say('a_diag');return}
 if(intent==='notify'){if(isAdv()&&S.care.on&&S.alert){say('a_notify');openSheet({t:'notify'})}else if(!S.care.on){say('a_notify_off')}else say('a_fallback');return}
 if(intent==='report'){S.reportAt=S.reportAt||tick();say('a_report');setTimeout(()=>{go('report');toast('Report prepared')},650);if(c.stage!=='idle')c.stage='done';return}
 if(intent==='log'){say('a_log');openForm(null,true);return}
 switch(c.stage){
  case 'ask':
   if(intent==='warm'){c.pend=['warmth'];c.stage='more';say('a_more')}
   else if(intent==='nothing'){c.pend=['none'];c.stage='confirm';say('a_confirm',{items:c.pend})}
   else if(intent==='meaning') say('a_meaning');
   else say('a_fallback');
   break;
  case 'more':
   if(intent==='none_visible'||intent==='nothing') c.pend=['warmth','no_visible'];
   else if(intent==='red') c.pend=['warmth','redness'];
   else if(intent==='swell') c.pend=['warmth','swelling'];
   else {say('a_fallback');break}
   c.stage='confirm';say('a_confirm',{items:c.pend});break;
  case 'confirm':
   if(intent==='yes'){
    const none=c.pend.includes('none');
    const rec=saveSymptom({items:c.pend.filter(x=>x!=='no_visible').length?c.pend.slice():['none'],foot:none?null:'left',area:none?null:'Forefoot',onset:'today',note:'',source:'assistant'});
    c.stage='done';say('a_done',{items:c.pend.slice(),time:fmt(rec.time)});
   } else if(intent==='change'){say('a_change');openForm({items:c.pend.filter(x=>x!=='no_visible'),foot:c.pend.includes('none')?null:'left',area:c.pend.includes('none')?null:'Forefoot'},true)}
   else say('a_fallback');
   break;
  case 'done':
   say('a_fallback');break;
  default:
   if(intent==='readings') say(anyOff()?'a_readings_off':S.alert?'a_readings_alert':'a_readings');
   else say('a_fallback');
 }
}
function userIntent(intent,raw,vt){
 if(intent==='restart'){startChat();render();return}
 S.chat.msgs.push(vt?{from:'u',vt}:raw!=null?{from:'u',raw}:{from:'u',key:'u_'+intent});
 respond(intent);render();
}

 }).join('');
 return `<div class="chat-top"><div class="row"><h1 class="title">Assistant</h1>${seg('lang',[['en','English'],['hi','हिंदी']],c.lang)}</div><p class="disc">${tx('disc')}</p></div>
  <div class="msgs" id="msgs" aria-live="polite">${msgs}</div>

  <div class="composer"><input id="chat_in" type="text" autocomplete="off" placeholder="${tx('ph')}" aria-label="${tx('ph')}" data-input="chat" value="${esc(c.draft)}">
   <button type="button" class="ibtn mic" data-action="voice" aria-label="Voice check-in">${ic('mic')}</button>

  ${S.listening?`<div class="listen" role="status"><div class="rings"><i></i><i></i><i></i><b>${ic('mic')}</b></div><div class="wave">${'<i></i>'.repeat(9)}</div><p>${tx('listen')}</p></div>`:''}`;
}

/* ---------- sheets ---------- */
function openSheet(s){S.sheet=s}
function closeSheet(){S.sheet=null;S.form=null;S.setup=null;render()}
function head(title,sub,extra){return `<div class="grab"></div><div class="p-head"><div><h2 id="sheet-title">${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><button type="button" class="x" data-action="close" aria-label="Close">${ic('x')}</button></div>${extra||''}`}
function openForm(pre,fromChat){
 S.form={fromChat:!!fromChat,step:'edit',items:pre&&pre.items?pre.items.slice():[],foot:pre&&pre.foot!==undefined?pre.foot:(S.alert?'left':null),area:pre&&pre.area!==undefined?pre.area:(S.alert?'Forefoot':null),onset:'today',note:'',err:''};
 openSheet({t:'form'});
}
function sheetForm(){

function saveSymptom(r){const rec={...r,time:tick(2)};S.symptoms.push(rec);return rec}

function notifyBody(){
 const sym=lastSym();
 const body=S.alert?`Left forefoot has read warmer than the right for 2 days. ${sym?'Meera confirmed: '+sym.items.map(x=>SYM.en[x].toLowerCase()).join(', ')+'.':'No symptoms recorded yet.'} ${S.reportAt||S.shares.length?'A report is ready to view.':''}`:'Example: Meera shared an alert with you. Open StepSure to see the details she chose to share.';
 return `<div class="notif"><div class="n"><div class="nh"><span><i></i>StepSure</span><span>now</span></div><strong>Update from Meera</strong><p>${esc(body)}</p></div><p class="cap">Preview of Riya's phone notification</p></div>`;
}
function sheetNotify(){
 const n=S.care.notice;
 let foot;
 if(!S.care.on) foot=`<p class="note">Sharing with Riya is off.</p><button type="button" class="btn primary" data-action="consent">Turn on sharing</button>`;
 else if(!S.alert) foot=`<p class="note">Updates go to Riya only when you choose to share an alert or report. There is nothing to send right now.</p><button type="button" class="btn secondary" data-action="close">Close</button>`;
 else if(!n) foot=`<p class="note">Riya receives this once you send it.</p><button type="button" class="btn primary" data-action="sendNotice">${ic('send')}Send to Riya</button>`;
 else foot=`<div class="pipe" style="font-size:13px"><span class="p on">Sent ${fmt(n.sent)}</span>${ic('chev')}<span class="p${n.ack?' on':''}">${n.ack?'Acknowledged '+fmt(n.ack):'Waiting for Riya'}</span></div>
  <p class="note">Acknowledged means Riya opened the update. It doesn't mean a clinician has been contacted.</p>
  ${n.ack?`<button type="button" class="btn secondary" data-action="close">Close</button>`:`<button type="button" class="btn secondary" data-action="ack">Riya opens it</button>`}`;
 return head('Update for Riya',adv())+notifyBody()+foot;
}
function sheetConsent(){
 return head('Share updates with Riya',adv())+`<ul class="list"><li>${ic('check')}<span>Riya gets alerts, symptoms you confirm and reports you choose to send.</span></li>
  <li>${ic('x')}<span>Riya can't see live readings. No one watches your readings around the clock.</span></li>
  <li>${ic('refresh')}<span>You can stop sharing at any time in Profile.</span></li></ul>
  <div class="btn-row"><button type="button" class="btn secondary" data-action="close">Not now</button><button type="button" class="btn primary" data-action="consentYes">Share with Riya</button></div>`;
}
function sheetRevoke(){
 return head('Stop sharing with Riya?','')+`<p>Riya won't receive any new updates. Updates already sent stay in your records.</p>
  <div class="btn-row"><button type="button" class="btn secondary" data-action="close">Keep sharing</button><button type="button" class="btn primary" data-action="revokeYes">Stop sharing</button></div>`;
}
function sheetShare(){
 const s=S.sheet;
 if(s.done) return head('Report shared','')+`<div class="big-ok">${ic('check')}</div><p class="center"><b style="color:var(--navy)">Shared with ${esc(s.done)} at ${fmt(S.shares[S.shares.length-1].time)}</b></p>
  <p class="note center">Sharing a report doesn't mark your clinician as contacted. Mark that in the follow-up tracker once you've spoken to them.</p><button type="button" class="btn primary" data-action="close">Done</button>`;
 const riyaOk=isAdv()&&S.care.on;
 return head('Share report','Choose who receives this report.')+`
  <button type="button" class="recip" data-action="shareTo" data-v="Dr. Anjali Rao's clinic">${ic('clinic')}<span class="pt"><strong>Dr. Anjali Rao's clinic</strong><span>Diabetic foot clinic</span></span>${ic('chev')}</button>
  ${riyaOk?`<button type="button" class="recip" data-action="shareTo" data-v="Riya">${ic('users')}<span class="pt"><strong>Riya</strong><span>Caregiver</span></span>${ic('chev')}</button>`
  :`<button type="button" class="locked" data-action="${isAdv()?'consent':'upgrade'}" data-f="Caregiver sharing">${ic(isAdv()?'users':'lock')}<span><strong>Riya</strong><br>${isAdv()?'Turn on sharing first':'Caregiver sharing is inactive on Free'}</span></button>`}
`;
}
function sheetInstr(){
 const d=S.instr;
 return head('Record clinician instructions','Write down what your clinician told you. StepSure doesn\'t add or change these.')+`
  <label class="field" for="i_text">Instructions<textarea id="i_text" rows="4" data-input="instrText" placeholder="For example, what to do and when to come back">${esc(d.text)}</textarea></label>
  <label class="field" for="i_by">Given by<input id="i_by" type="text" data-input="instrBy" value="${esc(d.by)}"></label>
  <button type="button" class="opt" aria-pressed="${d.ok}" data-action="instrOk">${ic('check')}I confirm these are the instructions my clinician gave me</button>
  ${d.err?`<p class="err" role="alert">${d.err}</p>`:''}
  <button type="button" class="btn primary" data-action="instrSave">Save instructions</button>`;
}
function sheetComplete(){
 const warn=!S.clin.contacted;
 return head('Mark follow-up completed?','')+`<p>This closes the follow-up for the temperature change. Your insoles keep recording, and new changes will still show as alerts.</p>
  ${warn?`<div class="callout urgent">${ic('alert')}<span>You haven't marked your clinician as contacted. Only complete the follow-up if you have spoken to your care team.</span></div>`:''}
  <div class="btn-row"><button type="button" class="btn secondary" data-action="close">Cancel</button><button type="button" class="btn primary" data-action="completeYes">Mark completed</button></div>`;
}
function sheetUpgrade(){
 return head(esc(S.sheet.f||'Advanced feature'),adv())+`<ul class="list"><li>${ic('chat')}<span>Scripted assistant in English and Hindi, by text or voice</span></li><li>${ic('file')}<span>Richer report summaries with trend charts</span></li><li>${ic('users')}<span>Caregiver sharing with Riya</span></li></ul>
  <div class="callout info">${ic('info')}<span>Alerts, next steps, symptom recording and basic reports are included in every plan.</span></div>
  <div class="btn-row"><button type="button" class="btn secondary" data-action="close">Not now</button><button type="button" class="btn primary" data-action="tier" data-tier="adv">Switch to Advanced</button></div>`;
}
const SHEETS={form:sheetForm,setup:sheetSetup,notify:sheetNotify,consent:sheetConsent,revoke:sheetRevoke,share:sheetShare,instr:sheetInstr,complete:sheetComplete,upgrade:sheetUpgrade,explain:sheetExplain};

/* ---------- render ---------- */
const SCREENS={home,trends,assistant,profile,device,alert:alertScr,report};
const TAB_OF={home:'home',device:'home',alert:'home',report:'home',trends:'trends',assistant:'assistant',profile:'profile'};
function focusKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+el.id;const d=el.dataset||{};if(!d.action)return null;return `[data-action="${d.action}"]${d.k?`[data-k="${d.k}"]`:''}${d.v!=null?`[data-v="${CSS.escape(d.v)}"]`:''}${d.to?`[data-to="${d.to}"]`:''}${d.tier?`[data-tier="${d.tier}"]`:''}`}
function render(){
 const fk=focusKey(document.activeElement);
 const view=$('#view'),same=view.dataset.screen===S.screen,st=view.scrollTop;
 const msgsEl=$('#msgs'),mst=msgsEl?msgsEl.scrollTop:0;
 view.className='view'+(S.screen==='assistant'&&isAdv()?' chat':'');
 view.innerHTML=SCREENS[S.screen]();
 view.dataset.screen=S.screen;
 if(same) view.scrollTop=st; else {view.scrollTop=0;view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter')}
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 const tab=TAB_OF[S.screen];
 $('#tabs').innerHTML=[['home','Home','home'],['trends','Trends','trend'],['assistant','Assistant','chat'],['profile','Profile','user']].map(t=>`<button type="button" data-action="go" data-to="${t[0]}" ${tab===t[0]?'aria-current="page"':''}>${ic(t[2])}${t[1]}</button>`).join('');
 $('#tier').innerHTML=`<button type="button" role="radio" aria-checked="${!isAdv()}" data-action="tier" data-tier="free">Free</button><button type="button" role="radio" aria-checked="${isAdv()}" data-action="tier" data-tier="adv">${ic('spark')}Advanced</button>`;
 $('#clock').textContent=fmt(S.clock);
 const layer=$('#layer');
 if(S.sheet&&SHEETS[S.sheet.t]){
  const isNew=lastSheet!==S.sheet.t;
  layer.hidden=false;layer.className='layer'+(isNew?' anim':'');
  layer.innerHTML=`<button type="button" class="scrim" data-action="close" aria-label="Close" tabindex="-1"></button><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">${SHEETS[S.sheet.t]()}</div>`;
  view.inert=true;$('#tabs').inert=true;
  if(isNew){const p=layer.querySelector('.panel');p.focus({preventScroll:true})}
  lastSheet=S.sheet.t;
 } else {layer.hidden=true;layer.innerHTML='';view.inert=false;$('#tabs').inert=false;lastSheet=null}
 if(fk){try{const el=document.querySelector(fk);if(el&&!el.closest('[inert]'))el.focus({preventScroll:true})}catch(e){}}
}
function go(to){S.screen=to;if(to==='report'&&S.alert)S.reportAt=S.reportAt||S.clock;render()}
function toast(msg){const t=$('#toast');t.innerHTML=`${ic('checkc')}<span>${esc(msg)}</span>`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},2600)}
function later(ms,fn){const e=epoch;setTimeout(()=>{if(e===epoch)fn()},ms)}

/* ---------- report export ---------- */
function reportText(){
 const tmp=document.createElement('div');tmp.innerHTML=reportHTML(true);
 const lines=[];
 tmp.querySelectorAll('.rep-head h2,.rep-head p,.rep-sec h3,.rep-sec p,.rep-sec li,.rep-sec tr,.rep-foot').forEach(el=>{
  if(el.tagName==='TR') lines.push(Array.from(el.children).map(c=>c.textContent.trim()).join('  |  '));
  else if(el.tagName==='H3'){lines.push('');lines.push(el.textContent.trim().toUpperCase())}
  else if(el.tagName==='LI') lines.push('- '+el.textContent.trim());
  else if(el.classList.contains('rep-foot')){lines.push('');lines.push(el.textContent.trim())}
  else lines.push(el.textContent.trim());
 });
 return lines.join('\n');
}
function copyText(txt){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'Report text copied':'Copy blocked by the browser. Select the report text instead.')};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Report text copied'),fallback)}else fallback();
}

/* ---------- actions ---------- */
const A={
 go:d=>{S.sheet=null;go(d.to)},
 seg:d=>{if(d.k==='lang')S.chat.lang=d.v;else S[d.k]=d.v;render()},
 tier:d=>{
  if(S.tier===d.tier){if(S.sheet&&S.sheet.t==='upgrade')closeSheet();return}
  S.tier=d.tier;
  if(S.sheet&&(S.sheet.t==='upgrade'||(!isAdv()&&['notify','consent','revoke'].includes(S.sheet.t)))){S.sheet=null}
  render();toast(isAdv()?'Advanced plan on':(S.care.on?'Free plan. Caregiver sharing is now inactive. Records are unchanged.':'Free plan. Your records are unchanged.'));
 },
 reset:()=>{init();render();toast('Reset')},
 close:()=>closeSheet(),
 simulate:()=>{
  if(!S.dev.L.on){toast('Reconnect the left insole first. The alert needs its readings.');return}
  const t=tick(2);['L','R'].forEach(k=>{if(S.dev[k].on)S.dev[k].sync=t});
  S.alert={at:t};S.mapMode='temp';
  if(S.chat.stage==='idle'&&!S.chat.msgs.some(m=>m.from==='u'))S.chat.stage=null;
  render();toast('New alert');
 },
 toggleDev:d=>{
  const v=S.dev[d.k];
  if(v.on){v.on=false;v.since=tick();toast(`${sideName(d.k)} insole disconnected`)}
  else{const t=tick(3);S.gaps.push({k:d.k,from:v.since,to:t});v.on=true;v.since=null;v.sync=t;toast(`${sideName(d.k)} insole reconnected and synced`)}
  render();
 },
 openSetup:()=>{S.setup={step:0,L:'idle',R:'idle',fit:{},check:null};openSheet({t:'setup'});render()},
 setupNext:()=>{S.setup.step++;render()},
 pair:d=>{S.setup[d.k]='searching';render();later(1300,()=>{if(S.setup){S.setup[d.k]='paired';render()}})},
 fit:d=>{S.setup.fit[d.v]=!S.setup.fit[d.v];render()},
 runCheck:()=>{S.setup.check='run';render();later(1800,()=>{if(S.setup){S.setup.check='done';render()}})},
 setupDone:()=>{const t=tick(2);['L','R'].forEach(k=>{const v=S.dev[k];if(!v.on)S.gaps.push({k,from:v.since,to:t});v.on=true;v.since=null;v.sync=t});S.sheet=null;S.setup=null;render();toast('Insoles paired and recording')},
 openForm:()=>{openForm(null);render()},
 formSym:d=>{const f=S.form;f.err='';if(d.v==='none'){f.items=f.items.includes('none')?[]:['none']}else{f.items=f.items.filter(x=>x!=='none');f.items=f.items.includes(d.v)?f.items.filter(x=>x!==d.v):f.items.concat(d.v)}render()},
 formFoot:d=>{S.form.foot=d.v;S.form.err='';render()},
 formArea:d=>{S.form.area=d.v;S.form.err='';render()},
 formOnset:d=>{S.form.onset=d.v;render()},
 formReview:()=>{const f=S.form;if(!f.items.length){f.err='Choose at least one option, or "No symptoms noticed".';render();return}
  if(!f.items.includes('none')&&(!f.foot||!f.area)){f.err='Choose which foot and where on the foot.';render();return}
  f.step='review';render()},
 formEdit:()=>{S.form.step='edit';render()},
 formSave:()=>{const f=S.form,none=f.items.includes('none');const rec=saveSymptom({items:f.items.slice(),foot:none?null:f.foot,area:none?null:f.area,onset:f.onset,note:f.note.trim(),source:'form'});
  if(f.fromChat){if(S.chat.stage!=='idle')S.chat.stage='done';S.chat.msgs.push({from:'a',key:'a_saved',p:{items:f.items.slice(),time:fmt(rec.time)}})}
  S.sheet=null;S.form=null;render();toast(`Symptoms recorded at ${fmt(rec.time)}`)},
 prepare:()=>{S.reportAt=S.reportAt||tick();go('report');toast('Report prepared')},
 share:()=>{openSheet({t:'share'});render()},
 shareTo:d=>{S.shares.push({to:d.v,time:tick()});S.sheet={t:'share',done:d.v};S.reportAt=S.reportAt||S.clock;render()},
 instr:()=>{const c=S.clin.instr;S.instr={text:c?c.text:'',by:c?c.by:'Dr. Anjali Rao',ok:false,err:''};openSheet({t:'instr'});render()},
 instrOk:()=>{S.instr.ok=!S.instr.ok;S.instr.err='';render()},
 instrSave:()=>{const d=S.instr;if(!d.text.trim()){d.err='Enter the instructions your clinician gave you.';render();return}if(!d.ok){d.err='Tick the confirmation to save.';render();return}
  S.clin.instr={text:d.text.trim(),by:d.by.trim()||'Clinician',at:tick()};S.sheet=null;S.instr=null;render();toast('Clinician instructions saved')},
 contacted:()=>{S.clin.contacted=tick();render();toast('Marked: clinician contacted')},
 complete:()=>{if(!S.alert||S.follow)return;openSheet({t:'complete'});render()},
 completeYes:()=>{S.follow=tick();S.sheet=null;render();toast('Follow-up marked completed')},
 notify:()=>{if(!isAdv()){openSheet({t:'upgrade',f:'Caregiver sharing'});render();return}openSheet({t:'notify'});render()},
 sendNotice:()=>{S.care.notice={sent:tick(),ack:null};render();toast('Update sent to Riya')},
 ack:()=>{if(S.care.notice&&!S.care.notice.ack){S.care.notice.ack=tick(2);render();toast('Riya acknowledged the update')}},
 consent:()=>{if(!isAdv()){openSheet({t:'upgrade',f:'Caregiver sharing'});render();return}openSheet({t:'consent'});render()},
 consentYes:()=>{S.care.on=true;S.care.since=tick();S.sheet=null;render();toast('Sharing with Riya is on')},
 revoke:()=>{openSheet({t:'revoke'});render()},
 revokeYes:()=>{S.care.on=false;S.care.since=null;S.sheet=null;render();toast('Sharing with Riya stopped')},
 upgrade:d=>{openSheet({t:'upgrade',f:d.f});render()},
 explain:()=>{openSheet({t:'explain'});render()},
 chip:d=>{userIntent(d.v,null)},
 chatSend:()=>{const t=S.chat.draft.trim();if(!t)return;S.chat.draft='';const it=classify(t);if(it==='restart'){startChat();render();return}S.chat.msgs.push({from:'u',raw:t});respond(it||'unknown');render();const el=$('#chat_in');if(el)el.focus()},
 voice:()=>{if(S.listening)return;S.listening=true;render();
  later(2300,()=>{S.listening=false;const st=S.chat.stage;
   const map={ask:['warm','v_ask'],more:['none_visible','v_more'],confirm:['yes','v_confirm'],done:['report','v_done'],idle:['readings','v_idle']};
   const [intent,key]=map[st]||map.idle;
   S.chat.msgs.push({from:'u',vt:{en:T.en[key],hi:T.hi[key]}});respond(intent);render()})},
 copyReport:()=>copyText(reportText()),
 print:()=>{$('#printArea').innerHTML=reportHTML(true);window.print()},
 download:()=>{const b=new Blob([reportText()],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='StepSure-report-Meera-30-Oct-2026.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Report downloaded')}
};
const INP={chat:v=>{S.chat.draft=v},formNote:v=>{if(S.form)S.form.note=v},instrText:v=>{if(S.instr)S.instr.text=v},instrBy:v=>{if(S.instr)S.instr.by=v}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const f=A[b.dataset.action];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k&&INP[k])INP[k](e.target.value)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.sheet){e.preventDefault();closeSheet();return}
 if(e.key==='Enter'&&e.target.id==='chat_in'){e.preventDefault();A.chatSend()}
});

init();render();
window.__stepsure={get state(){return S}};
})();
</script>
</body>
</html>
